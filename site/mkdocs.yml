# Инфраструктура сайта живёт здесь, материалы — папками в корне репозитория,
# по одной на предмет. Отсюда docs_dir: ..
site_name: Курсы П. Радилова
site_description: Лекции, задания и материалы курсов ПГУ им. Т. Г. Шевченко
site_url: https://radilov-spsu.github.io/materials/
repo_url: https://github.com/radilov-spsu/materials
repo_name: radilov-spsu/materials
edit_uri: edit/main/
copyright: ПГУ им. Т. Г. Шевченко, Тирасполь

docs_dir: ..

# Всё, что не является материалами курсов.
exclude_docs: |
  README.md
  .github/
  site/mkdocs.yml
  site/requirements.txt

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

extra_css:
  - site/stylesheets/styles.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - ru
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radilov-spsu
      name: Организация курсов

nav:
  - Главная: index.md
  - Объектно-ориентированный анализ и проектирование:
      - О курсе: OOP/index.md
      - "Раздел 1. Объектная модель":
          - "Лекция 1 · Объектная модель": OOP/lectures/01-obektnaya-model.md
          - "Лекция 2 · Архитектура и рефакторинг": OOP/lectures/02-arkhitektura-i-refaktoring.md
          - "Самостоятельно · Классы, объекты, инкапсуляция": OOP/self-study/01-klassy-obekty-inkapsulyatsiya.md
          - "Самостоятельно · Наследование и полиморфизм": OOP/self-study/02-nasledovanie-i-polimorfizm.md
          - "Самостоятельно · Архитектурные стили и связность": OOP/self-study/03-arkhitekturnye-stili-i-svyaznost.md
      - "Раздел 2. Моделирование на UML":
          - "Лекция 3 · UML: диаграммы классов": OOP/lectures/03-uml-diagrammy-klassov.md
          - "Лекция 4 · Последовательности и состояния": OOP/lectures/04-posledovatelnosti-i-sostoyaniya.md
          - "Самостоятельно · Виды UML-диаграмм и предметная область": OOP/self-study/04-vidy-uml-diagramm-i-predmetnaya-oblast.md
      - "Раздел 3. Паттерны проектирования":
          - "Лекция 5 · Порождающие паттерны": OOP/lectures/05-porozhdayushchie-patterny.md
          - "Лекция 6 · Структурные паттерны": OOP/lectures/06-strukturnye-patterny.md
          - "Лекция 7 · Паттерны поведения": OOP/lectures/07-patterny-povedeniya.md
          - "Самостоятельно · Порождающие: Lazy, Pool, Multiton": OOP/self-study/05-lazy-object-pool-multiton.md
          - "Самостоятельно · Flyweight, Visitor, Interpreter": OOP/self-study/06-flyweight-visitor-interpreter.md
          - "Самостоятельно · Антипаттерны и комбинирование": OOP/self-study/07-antipatterny-i-kombinirovanie.md
      - "Раздел 4. Шаблоны корпоративных приложений":
          - "Лекция 8 · Шаблоны корпоративных приложений": OOP/lectures/08-shablony-korporativnykh-prilozheniy.md
          - "Самостоятельно · Active Record и Data Mapper": OOP/self-study/08-active-record-i-data-mapper.md
          - "Самостоятельно · Слои, DTO и маппинг": OOP/self-study/09-sloi-dto-i-mapping.md
      - Лабораторные работы: OOP/labs.md
  - Технологии параллельного программирования:
      - О курсе: Parallel/index.md
      - Лабораторные работы: Parallel/labs.md
  - Технология программирования:
      - О курсе: TechProg/index.md
      - Лабораторные работы: TechProg/labs.md
