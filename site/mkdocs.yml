# Инфраструктура сайта живёт здесь, материалы — папками в корне репозитория,
# по одной на предмет. Отсюда docs_dir: ..
site_name: Курсы П. Радилова
site_description: Лекции, задания и материалы курсов ПГУ им. Т. Г. Шевченко
site_url: https://radilov-spsu.github.io/materials/
repo_url: https://github.com/radilov-spsu/materials
repo_name: radilov-spsu/materials
edit_uri: edit/main/
copyright: ПГУ им. Т. Г. Шевченко, Тирасполь

docs_dir: ..

# Всё, что не является материалами курсов.
# Parallel спрятан, пока там только заглушка: файлы остаются в репозитории,
# но на сайт не попадают. Чтобы вернуть — убрать строку отсюда и
# раскомментировать раздел в nav.
exclude_docs: |
  README.md
  .github/
  site/mkdocs.yml
  site/requirements.txt
  Parallel/

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

extra_css:
  - site/stylesheets/styles.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - ru
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radilov-spsu
      name: Организация курсов

nav:
