name: Сайт материалов

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ops/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r site/requirements.txt

      # Конфигурация лежит в site/, а материалы — папками в корне,
      # поэтому site_dir выносим за пределы docs_dir (он же корень репозитория).
      # --strict: битая ссылка роняет сборку, а не публикуется молча.
      - run: mkdocs build --strict --config-file site/mkdocs.yml --site-dir "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
